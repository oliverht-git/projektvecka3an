<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBSradarn</title>
    <link rel="stylesheet" href="chatt.css">
    <link rel="stylesheet" href="report.css">
</head>
<body>
    <header class="chat-header">
        <h1>Chatt</h1>        
        <a href="main.html">Tillbaka</a>
        <a href="profil.html" aria-label="Gå till profilen">
            <img id="profile-picture-display" class="profile-picture" src="normalpfp.svg" alt="Profilbild">
        </a>
    </header>
    <main class="chat-layout">
        <aside class="conversation-panel" aria-label="Konversationer">
            <h2>Konversationer</h2>
            <p id="conversation-status" role="status">Laddar konversationer...</p>
            <div id="conversation-list" class="conversation-list"></div>
        </aside>
        <section class="message-panel" aria-label="Meddelanden">
            <div id="chat-empty-state" class="chat-empty-state">Välj en konversation för att börja chatta.</div>
            <div id="active-chat" class="active-chat" hidden>
                <header class="active-chat-header">
                    <img id="active-chat-picture" src="normalpfp.svg" alt="">
                    <h2 id="active-chat-name"></h2>
                </header>
                <div id="message-list" class="message-list" aria-live="polite"></div>
                <p id="message-status" class="message-status" role="status"></p>
                <form id="message-form" class="message-form">
                    <label class="visually-hidden" for="message-input">Skriv ett meddelande</label>
                    <input id="message-input" name="message" type="text" maxlength="2000" autocomplete="off" placeholder="Skriv ett meddelande..." required>
                    <button id="send-message-button" type="submit">Skicka</button>
                </form>
            </div>
        </section>
    </main>
    <dialog id="report-dialog" class="report-dialog" aria-labelledby="report-dialog-title">
        <form id="report-form">
            <h2 id="report-dialog-title">Anmäl meddelande</h2>
            <p id="report-subject"></p>
            <label for="report-reason">Anledning</label>
            <select id="report-reason" name="reason" required>
                <option value="">Välj en anledning</option>
                <option value="olämplig profilbild">Olämplig profilbild</option>
                <option value="trakasserier">Trakasserier</option>
                <option value="hot">Hot</option>
                <option value="spam">Spam</option>
                <option value="annat">Annat</option>
            </select>
            <label for="report-details">Beskrivning (valfri, max 500 tecken)</label>
            <textarea id="report-details" name="details" maxlength="500" rows="4"></textarea>
            <p id="report-status" role="status"></p>
            <div class="report-dialog-actions">
                <button id="cancel-report-button" type="button">Avbryt</button>
                <button id="submit-report-button" type="submit">Skicka anmälan</button>
            </div>
        </form>
    </dialog>
    <script src="account.js"></script>
    <script src="chat.js"></script>
    <script src="report.js"></script>
</body>
</html>

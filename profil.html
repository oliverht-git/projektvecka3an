<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBSradarn</title>
    <link rel="stylesheet" href="profil.css">
</head>

    <div class="navbar">
        <a href="main.html"><h1 class="title">LBSradarn</h1></a>


    </div>
<p id="display-name" class="account-name"></p>
<img id="profile-picture-display" class="profile-picture" alt="Profilbild">
<body>


    <main>
        <section id="profile-screen">
            <h1 class="h1">Profil</h1>
        </section>
    </main>

        <main>
        <section id="settings-screen">

            <form id="settings-form">
                <label for="change-username">Ändra användarnamn:</label>
                <input type="text" id="change-username" name="change-username" minlength="3" maxlength="20" required>
                <input type="submit" value="Spara ändringar">
            </form>
        </section>
    </main>

    <img type="file" id="profile-picture-input" accept="image/*" style="display: none;">
    <button id="change-profile-picture-button" class="btn">Ändra profilbild</button>

</body>
<script src="account.js"></script>
</html>

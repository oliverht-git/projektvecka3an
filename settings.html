<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBSradarn</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="navbar">
        <a href="main.html"><h1>LBS Radarn</h1></a> 
    </div>

    <div class="settings">
        <button id="theme-switch">Byt tema</button>
        <button id="sv-eng">språk</button>
        <button id="logout-button" onclick="location.href='index.html'">Logga ut</button>
        <button id="delete-account-button" onclick="location.href='index.html'">Radera konto</button>
    </div>



    <main>
        <section id="settings-screen">
            <h1 class="h1">Inställningar</h1>
            <form id="settings-form">
                <label for="change-username">Ändra användarnamn:</label>
                <input type="text" id="change-username" name="change-username" minlength="3" maxlength="20" required>
                <input type="submit" value="Spara ändringar">
            </form>
        </section>
    </main>



</body>
<script src="settings.js"></script>
</html>

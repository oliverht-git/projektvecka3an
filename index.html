<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBSradarn</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">
        <h1 class="title">LBS Radarn</h1>
    </div>

    <main>
        <section id="signup-screen">
            <h1 class="h1">Skapa konto</h1>
            <form id="signup-form">
                <label for="create-username">Email:</label>
                <input type="email" id="create-username" name="create-username" required>
                <label for="create-password">Lösenord:</label>
                <input type="password" id="create-password" name="create-password" minlength="8" required>
                <label for="rpt-password">Upprepa lösenord:</label>
                <input type="password" id="rpt-password" name="rpt-password" minlength="8" required>
                <input type="submit" value="Skapa konto">
            </form>
        </section>

        <section id="username-screen" hidden>
            <h1 class="h1">Skapa ditt användarnamn</h1>
            <form id="username-form">
                <label for="create-display-name">Användarnamn:</label>
                <input type="text" id="create-display-name" name="create-display-name" minlength="3" maxlength="20" required>
                <input type="submit" value="Spara användarnamn">
            </form>
        </section>

        <section id="login-screen">
            <h1 class="h1">Logga in</h1>
            <form id="login-form">
                <label for="user-username">Email:</label>
                <input type="email" id="user-username" name="user-username" required>
                <label for="user-password">Lösenord:</label>
                <input type="password" id="user-password" name="user-password" required>
                <input type="submit" value="Logga in">
            </form>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>

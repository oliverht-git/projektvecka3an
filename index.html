<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBSradarn</title>
    <link rel="stylesheet" href="style.css">
</head>

<div class="navbar">
    <h1 class="title">LBS Radarn</h1>
</div>

<body>
    <h1 class="h1">Skapa konto</h1>
    <div class="hide-signup-form">
        <button class="signup" onclick="myFunction()">Skapa konto</button>
    <form>
        <label for="create-username">Email:</label>
        <input type="text" id="create-username" name="create-username"><br><br>
        <label for="create-password">Lösenord:</label>
        <input type="password" id="create-password" name="create-password"><br><br>
        <label for="rpt-password">Upprepa Lösenord:</label>
        <input type="password" id="rpt-password" name="rpt-password"><br><br>
        <input type="submit" value="Submit">
    </form>        
    </div>





    <h1 class="h1">log in</h1>
    <div class="hide-login-form">
        <button class="login-button" onclick="myFunction()">Log in</button>

    <form>
        <label for="user-username">Email:</label>
        <input type="text" id="user-username" name="user-username"><br><br>
        <label for="user-password">Lösenord:</label>
        <input type="password" id="user-password" name="user-password"><br><br>
        <input type="submit" value="Submit">
    </form>
    </div>






</body>
</html>
